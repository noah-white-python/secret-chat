<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SecretChat</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0e17; --card: #1a1a2e; --card2: #16213e;
    --accent: #7c3aed; --accent2: #6d28d9;
    --text: #e2e8f0; --dim: #94a3b8;
    --ok: #10b981; --err: #ef4444;
    --self: #2d1b69; --other: #1e293b;
  }
  body { background: var(--bg); color: var(--text); font-family: "Microsoft YaHei", "PingFang SC", sans-serif; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Login ── */
  #login { display: flex; flex-direction: column; align-items: center; justify-content: center; flex: 1; padding: 24px; }
  #login h1 { font-size: 28px; font-weight: 700; margin-bottom: 6px; }
  #login .sub { color: var(--dim); font-size: 12px; margin-bottom: 32px; }
  .field-label { font-size: 13px; color: var(--dim); align-self: flex-start; margin-bottom: 4px; margin-top: 12px; width: 100%; max-width: 400px; }
  .field { width: 100%; max-width: 400px; height: 42px; background: var(--card); border: 1px solid var(--accent); border-radius: 8px; color: var(--text); font-size: 14px; padding: 0 14px; outline: none; font-family: inherit; }
  .field:focus { border-color: #a855f7; }
  #join-btn { width: 100%; max-width: 400px; height: 46px; background: var(--accent); border: none; border-radius: 10px; color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 24px; font-family: inherit; transition: background .15s; }
  #join-btn:hover { background: var(--accent2); }
  #join-btn:disabled { opacity: .5; cursor: default; }
  #login-tip { margin-top: 10px; font-size: 12px; color: var(--dim); min-height: 18px; }

  /* ── Chat ── */
  #chat { display: none; flex-direction: column; flex: 1; overflow: hidden; }
  #header { background: var(--card); padding: 0 18px; height: 52px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #header .room-name { font-size: 15px; font-weight: 700; }
  #header .enc-badge { font-size: 11px; color: var(--ok); }
  #main { display: flex; flex: 1; overflow: hidden; }
  #messages { flex: 1; overflow-y: auto; padding: 12px 10px; display: flex; flex-direction: column; gap: 4px; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--card2); border-radius: 2px; }
  #sidebar { width: 140px; background: var(--card); padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; flex-shrink: 0; overflow-y: auto; }
  #sidebar h3 { font-size: 11px; color: var(--dim); font-weight: 600; margin-bottom: 8px; letter-spacing: .5px; }
  .user-item { font-size: 12px; padding: 3px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .user-item.me { color: var(--ok); }
  #input-bar { background: var(--card); padding: 12px; display: flex; gap: 8px; align-items: center; flex-shrink: 0; }
  #img-btn { height: 38px; padding: 0 14px; background: var(--card2); border: 1px solid var(--accent); border-radius: 8px; color: var(--dim); font-size: 13px; cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0; }
  #img-btn:hover { color: var(--text); background: var(--accent); border-color: var(--accent); }
  #text-input { flex: 1; height: 38px; background: var(--card2); border: 1px solid var(--accent); border-radius: 8px; color: var(--text); font-size: 14px; padding: 0 14px; outline: none; font-family: inherit; min-width: 0; }
  #text-input:focus { border-color: #a855f7; }
  #send-btn { height: 38px; padding: 0 20px; background: var(--accent); border: none; border-radius: 8px; color: #fff; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; flex-shrink: 0; }
  #send-btn:hover { background: var(--accent2); }

  /* ── Bubbles ── */
  .sys-msg { text-align: center; font-size: 11px; color: var(--dim); padding: 4px 0; }
  .msg-row { display: flex; flex-direction: column; }
  .msg-row.self { align-items: flex-end; }
  .msg-row.other { align-items: flex-start; }
  .sender-name { font-size: 10px; color: var(--dim); margin-bottom: 2px; padding: 0 4px; }
  .bubble { max-width: 72%; border-radius: 14px; padding: 9px 14px; font-size: 14px; line-height: 1.5; word-break: break-word; }
  .bubble.self { background: var(--self); border-bottom-right-radius: 4px; }
  .bubble.other { background: var(--other); border-bottom-left-radius: 4px; }
  .bubble img { max-width: 100%; max-height: 240px; border-radius: 8px; display: block; cursor: pointer; }
  .ts { font-size: 9px; color: var(--dim); margin-top: 2px; padding: 0 4px; }

  /* ── Mobile ── */
  @media (max-width: 560px) {
    #sidebar { width: 90px; }
    #sidebar h3 { display: none; }
    .bubble { max-width: 85%; }
  }
</style>
</head>
<body>

<!-- ── Login ── -->
<div id="login">
  <h1>SecretChat</h1>
  <p class="sub">端对端加密 · 消息不落盘 · 服务器看不到内容</p>

  <label class="field-label">服务器地址</label>
  <input class="field" id="server-input" value="wss://secret-chat-server-production.up.railway.app">

  <label class="field-label">房间号</label>
  <input class="field" id="room-input" placeholder="相同房间号的人可互相聊天">

  <label class="field-label">用户名</label>
  <input class="field" id="user-input" placeholder="你的昵称">

  <button id="join-btn">进入房间</button>
  <p id="login-tip"></p>
</div>

<!-- ── Chat ── -->
<div id="chat">
  <div id="header">
    <span class="room-name" id="room-label"></span>
    <span class="enc-badge">● 端对端加密</span>
  </div>
  <div id="main">
    <div id="messages"></div>
    <div id="sidebar">
      <h3>在线成员</h3>
      <div id="user-list"></div>
    </div>
  </div>
  <div id="input-bar">
    <button id="img-btn">图片</button>
    <input id="text-input" placeholder="输入消息，按 Enter 发送">
    <button id="send-btn">发送</button>
  </div>
</div>

<input type="file" id="file-input" accept="image/*" style="display:none">

<script>
// ── 工具函数 ──────────────────────────────────────────────────────────────────
const b64enc = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
const b64dec = s => { const b = atob(s); const u = new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u.buffer; };
const te = new TextEncoder(), td = new TextDecoder();

// ── 加密模块 ──────────────────────────────────────────────────────────────────
const Crypto = {
  keyPair: null,
  roomKey: null,

  async init() {
    this.keyPair = await crypto.subtle.generateKey(
      { name:"RSA-OAEP", modulusLength:2048, publicExponent:new Uint8Array([1,0,1]), hash:"SHA-256" },
      true, ["encrypt","decrypt"]
    );
  },

  async exportPublicKeyPEM() {
    const spki = await crypto.subtle.exportKey("spki", this.keyPair.publicKey);
    const b64  = b64enc(spki).match(/.{1,64}/g).join("\n");
    return `-----BEGIN PUBLIC KEY-----\n${b64}\n-----END PUBLIC KEY-----`;
  },

  async importPublicKey(pem) {
    const b64 = pem.replace(/-----[^-]+-----/g,"").replace(/\s/g,"");
    return crypto.subtle.importKey("spki", b64dec(b64),
      { name:"RSA-OAEP", hash:"SHA-256" }, false, ["encrypt"]);
  },

  async rsaEncrypt(pubKey, data) {
    const ct = await crypto.subtle.encrypt({ name:"RSA-OAEP" }, pubKey, data);
    return b64enc(ct);
  },

  async rsaDecrypt(b64) {
    return crypto.subtle.decrypt({ name:"RSA-OAEP" }, this.keyPair.privateKey, b64dec(b64));
  },

  async generateRoomKey() {
    this.roomKey = await crypto.subtle.generateKey(
      { name:"AES-GCM", length:256 }, true, ["encrypt","decrypt"]
    );
  },

  async exportRoomKeyRaw() {
    return new Uint8Array(await crypto.subtle.exportKey("raw", this.roomKey));
  },

  async importRoomKey(raw) {
    this.roomKey = await crypto.subtle.importKey(
      "raw", raw, { name:"AES-GCM" }, true, ["encrypt","decrypt"]
    );
  },

  async encrypt(data) {
    const nonce = crypto.getRandomValues(new Uint8Array(12));
    const ct    = await crypto.subtle.encrypt({ name:"AES-GCM", iv:nonce }, this.roomKey, data);
    const out   = new Uint8Array(12 + ct.byteLength);
    out.set(nonce); out.set(new Uint8Array(ct), 12);
    return b64enc(out.buffer);
  },

  async decrypt(b64) {
    const buf   = new Uint8Array(b64dec(b64));
    const nonce = buf.slice(0, 12);
    const ct    = buf.slice(12);
    return crypto.subtle.decrypt({ name:"AES-GCM", iv:nonce }, this.roomKey, ct);
  }
};

// ── 状态 ──────────────────────────────────────────────────────────────────────
let ws, username, peerKeys = {};

// ── UI 引用 ───────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
const loginEl   = $("login");
const chatEl    = $("chat");
const messagesEl= $("messages");
const tipEl     = $("login-tip");

// ── 登录 ──────────────────────────────────────────────────────────────────────
$("join-btn").onclick = async () => {
  const server = $("server-input").value.trim();
  const room   = $("room-input").value.trim();
  const user   = $("user-input").value.trim();
  if (!server || !room || !user) { setTip("请填写所有字段", true); return; }
  username = user;
  $("join-btn").disabled = true;
  $("join-btn").textContent = "连接中...";
  setTip("正在生成加密密钥...");
  await Crypto.init();
  setTip("正在建立连接...");
  connect(server, room, user);
};

$("user-input").onkeydown = e => { if(e.key==="Enter") $("join-btn").click(); };

function setTip(msg, isErr=false) {
  tipEl.textContent = msg;
  tipEl.style.color = isErr ? "var(--err)" : "var(--dim)";
}

// ── WebSocket ─────────────────────────────────────────────────────────────────
async function connect(server, room, user) {
  try {
    ws = new WebSocket(server);
    ws.onopen = async () => {
      ws.send(JSON.stringify({
        type: "join", room_id: room, username: user,
        public_key: await Crypto.exportPublicKeyPEM()
      }));
    };
    ws.onmessage = e => handleMsg(JSON.parse(e.data));
    ws.onerror   = () => connFail("连接错误");
    ws.onclose   = () => {
      if (chatEl.style.display !== "none") sysMsg("连接已断开");
    };
  } catch(e) { connFail(e.message); }
}

function connFail(msg) {
  $("join-btn").disabled = false;
  $("join-btn").textContent = "进入房间";
  setTip("连接失败: " + msg, true);
}

// ── 消息处理 ──────────────────────────────────────────────────────────────────
async function handleMsg(msg) {
  const t = msg.type;

  if (t === "error") {
    connFail(msg.msg || "未知错误");

  } else if (t === "room_info") {
    for (const u of msg.users) {
      peerKeys[u.username] = await Crypto.importPublicKey(u.public_key);
    }
    if (msg.is_first) await Crypto.generateRoomKey();
    showChat(msg.room_id || $("room-input").value.trim());

  } else if (t === "user_joined") {
    const pub = await Crypto.importPublicKey(msg.public_key);
    peerKeys[msg.username] = pub;
    if (Crypto.roomKey) {
      const raw  = await Crypto.exportRoomKeyRaw();
      const enc  = await Crypto.rsaEncrypt(pub, raw.buffer);
      ws.send(JSON.stringify({ type:"room_key", to:msg.username, encrypted_key:enc }));
    }
    sysMsg(`${msg.username} 加入了房间`);

  } else if (t === "room_key") {
    if (!Crypto.roomKey) {
      const raw = await Crypto.rsaDecrypt(msg.encrypted_key);
      await Crypto.importRoomKey(raw);
    }

  } else if (t === "user_list") {
    refreshUserList(msg.users);

  } else if (t === "user_left") {
    refreshUserList(msg.users);
    sysMsg(`${msg.username} 离开了房间`);

  } else if (t === "message") {
    await recvMsg(msg);
  }
}

// ── 切换到聊天界面 ────────────────────────────────────────────────────────────
function showChat(room) {
  loginEl.style.display  = "none";
  chatEl.style.display   = "flex";
  $("room-label").textContent = "# " + room;
  refreshUserList([username]);
  sysMsg("已建立端对端加密连接，服务器无法读取任何内容");
}

// ── 气泡 ──────────────────────────────────────────────────────────────────────
function sysMsg(text) {
  const d = document.createElement("div");
  d.className = "sys-msg";
  d.textContent = `─── ${text} ───`;
  messagesEl.appendChild(d);
  scrollBottom();
}

function addBubble(sender, contentEl, isSelf) {
  const row = document.createElement("div");
  row.className = "msg-row " + (isSelf ? "self" : "other");

  if (!isSelf) {
    const name = document.createElement("div");
    name.className = "sender-name";
    name.textContent = sender;
    row.appendChild(name);
  }

  const bubble = document.createElement("div");
  bubble.className = "bubble " + (isSelf ? "self" : "other");
  bubble.appendChild(contentEl);
  row.appendChild(bubble);

  const now = new Date();
  const ts  = document.createElement("div");
  ts.className = "ts";
  ts.textContent = now.getHours().toString().padStart(2,"0") + ":" + now.getMinutes().toString().padStart(2,"0");
  row.appendChild(ts);

  messagesEl.appendChild(row);
  scrollBottom();
}

function scrollBottom() {
  setTimeout(() => messagesEl.scrollTop = messagesEl.scrollHeight, 40);
}

// ── 接收消息 ──────────────────────────────────────────────────────────────────
async function recvMsg(msg) {
  if (!Crypto.roomKey) return;
  const sender  = msg.from || "?";
  const isSelf  = sender === username;
  let raw;
  try { raw = await Crypto.decrypt(msg.content); } catch { return; }

  if (msg.msg_type === "text") {
    const span = document.createElement("span");
    span.textContent = td.decode(raw);
    addBubble(sender, span, isSelf);

  } else if (msg.msg_type === "image") {
    const blob = new Blob([raw], { type:"image/jpeg" });
    const url  = URL.createObjectURL(blob);
    const img  = document.createElement("img");
    img.src = url;
    img.onclick = () => window.open(url, "_blank");
    addBubble(sender, img, isSelf);
  }
}

// ── 发送文字 ──────────────────────────────────────────────────────────────────
async function sendText() {
  const text = $("text-input").value.trim();
  if (!text || !Crypto.roomKey) return;
  $("text-input").value = "";
  const enc = await Crypto.encrypt(te.encode(text));
  ws.send(JSON.stringify({ type:"message", msg_type:"text", content:enc }));
  const span = document.createElement("span");
  span.textContent = text;
  addBubble(username, span, true);
}

$("send-btn").onclick = sendText;
$("text-input").onkeydown = e => { if(e.key==="Enter" && !e.shiftKey) { e.preventDefault(); sendText(); } };

// ── 发送图片 ──────────────────────────────────────────────────────────────────
$("img-btn").onclick = () => $("file-input").click();
$("file-input").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file || !Crypto.roomKey) return;

  // 压缩图片
  const bitmap = await createImageBitmap(file);
  const maxW = 800, maxH = 600;
  let w = bitmap.width, h = bitmap.height;
  if (w > maxW || h > maxH) {
    const r = Math.min(maxW/w, maxH/h);
    w = Math.round(w*r); h = Math.round(h*r);
  }
  const canvas = document.createElement("canvas");
  canvas.width = w; canvas.height = h;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, w, h);

  const blob = await new Promise(res => canvas.toBlob(res, "image/jpeg", 0.82));
  const buf  = await blob.arrayBuffer();
  const enc  = await Crypto.encrypt(buf);
  ws.send(JSON.stringify({ type:"message", msg_type:"image", content:enc }));

  // 本地显示
  const url = URL.createObjectURL(blob);
  const img = document.createElement("img");
  img.src = url;
  img.onclick = () => window.open(url, "_blank");
  addBubble(username, img, true);
};

// ── 用户列表 ──────────────────────────────────────────────────────────────────
function refreshUserList(users) {
  const ul = $("user-list");
  ul.innerHTML = "";
  for (const u of users) {
    const d = document.createElement("div");
    d.className = "user-item" + (u === username ? " me" : "");
    d.textContent = (u === username ? "● " : "○ ") + u;
    ul.appendChild(d);
  }
}
</script>
</body>
</html>
